name: Deploy backend

# Deploys apps/t7m-api on push to main (Admin account).
# Single migration file; d1 already migrated. Requires repo secrets
# CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Admin account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: apps/api
      - name: Verify health
        run: |
          body="$(curl -fsS https://t7m-api.autumn-surf-21ec.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::t7m-api health check failed"; exit 1; }
