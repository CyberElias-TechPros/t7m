name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test submission
        run: |
          S="f1a1d276-8889-40ef-b1de-5043ece52bdb"
          npx -y wrangler@latest d1 execute t7m --remote --command "DELETE FROM submission_events WHERE submission_id='$S';"
          npx -y wrangler@latest d1 execute t7m --remote --command "DELETE FROM submissions WHERE id='$S';"
          npx -y wrangler@latest d1 execute t7m --remote --command "SELECT count(*) AS remaining FROM submissions WHERE id='$S';"
